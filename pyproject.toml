[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autogen-dakera"
version = "0.1.0"
description = "AutoGen integration for the Dakera AI memory platform"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dakera Team"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = ["autogen", "dakera", "memory", "ai", "agents"]
dependencies = ["dakera>=0.9.0"]

[project.optional-dependencies]
autogen = ["autogen-agentchat>=0.4.0"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "ruff>=0.1.0", "mypy>=1.0.0", "pip-audit>=2.0.0"]

[project.urls]
Homepage = "https://github.com/dakera-ai/dakera-autogen"
Documentation = "https://docs.dakera.ai/integrations/autogen"
Repository = "https://github.com/dakera-ai/dakera-autogen"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autogen_dakera = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
